<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Life OS</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://img.icons8.com/dusk/64/000000/clock--v1.png">

    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            min-height: 100vh;
        }

        /* Заголовок */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        h1 {
            font-weight: 800;
            font-size: 32px;
            margin: 0;
            background: linear-gradient(90deg, #fff, #8e8e93);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .settings-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Цитата */
        .quote-box {
            margin-bottom: 30px;
            font-style: italic;
            color: #8e8e93;
            font-size: 14px;
            line-height: 1.4;
            min-height: 40px;
        }

        /* Карточки */
        .card {
            background: #1c1c1e;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 15px;
            font-weight: 600;
            color: #aeaeb2;
            letter-spacing: 0.5px;
        }

        .percent { color: #fff; font-variant-numeric: tabular-nums; }

        .progress-bg {
            background-color: #2c2c2e;
            height: 16px;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 8px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        /* Эффект блика на полоске */
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0) 100%);
            opacity: 0.6;
        }

        /* Градиенты */
        .grad-day { background: linear-gradient(90deg, #30cfd0 0%, #330867 100%); }
        .grad-week { background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%); }
        .grad-month { background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%); }
        .grad-year { background: linear-gradient(90deg, #43e97b 0%, #38f9d7 100%); }
        .grad-life { background: linear-gradient(90deg, #fa709a 0%, #fee140 100%); }
        .grad-custom { background: linear-gradient(90deg, #89f7fe 0%, #66a6ff 100%); }

        /* Меню настроек */
        #settings-panel {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(10px);
            padding: 30px;
            z-index: 100;
            overflow-y: auto;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        label { display: block; margin-bottom: 8px; color: #8e8e93; font-size: 14px; margin-top: 20px;}
        input {
            width: 100%; padding: 14px; background: #2c2c2e; border: none;
            color: white; border-radius: 12px; font-size: 16px;
            box-sizing: border-box;
        }

        .save-btn {
            width: 100%; background: #0a84ff; color: white; border: none;
            padding: 16px; border-radius: 14px; font-size: 17px; font-weight: 600;
            margin-top: 30px; cursor: pointer;
        }
        
        .close-btn {
            background: transparent; color: #0a84ff; border: none;
            font-size: 17px; float: right; cursor: pointer;
        }
        
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Life OS</h1>
        <button class="settings-btn" onclick="toggleSettings()">⚙</button>
    </div>

    <div class="quote-box" id="quote-display">
        "Времени достаточно, если использовать его разумно."
    </div>

    <div class="card">
        <div class="label-row"><span>Сегодня</span><span class="percent" id="day-val">0%</span></div>
        <div class="progress-bg"><div class="progress-fill grad-day" id="day-bar"></div></div>
    </div>

    <div class="card">
        <div class="label-row"><span>До выходных</span><span class="percent" id="week-val">0%</span></div>
        <div class="progress-bg"><div class="progress-fill grad-week" id="week-bar"></div></div>
    </div>

    <div class="card">
        <div class="label-row"><span>Месяц</span><span class="percent" id="month-val">0%</span></div>
        <div class="progress-bg"><div class="progress-fill grad-month" id="month-bar"></div></div>
    </div>

    <div class="card">
        <div class="label-row"><span>Год</span><span class="percent" id="year-val">0%</span></div>
        <div class="progress-bg"><div class="progress-fill grad-year" id="year-bar"></div></div>
    </div>

    <div class="card hidden" id="life-card">
        <div class="label-row"><span>Жизнь (80 лет)</span><span class="percent" id="life-val">0%</span></div>
        <div class="progress-bg"><div class="progress-fill grad-life" id="life-bar"></div></div>
    </div>

    <div class="card hidden" id="custom-card">
        <div class="label-row"><span id="custom-title">Цель</span><span class="percent" id="custom-val">0%</span></div>
        <div class="progress-bg"><div class="progress-fill grad-custom" id="custom-bar"></div></div>
    </div>

    <div id="settings-panel">
        <button class="close-btn" onclick="toggleSettings()">Готово</button>
        <h2 style="margin-top: 0; color: #fff;">Настройки</h2>
        
        <label>Дата рождения</label>
        <input type="date" id="birth-date">

        <hr style="border: 0; border-top: 1px solid #333; margin: 30px 0;">

        <label>Название цели</label>
        <input type="text" id="target-name" placeholder="Например: Отпуск">
        
        <label>Дата начала</label>
        <input type="date" id="target-start">
        
        <label>Дедлайн</label>
        <input type="date" id="target-end">

        <button class="save-btn" onclick="saveSettings()">Сохранить</button>
    </div>

    <script>
        // --- Цитаты ---
        const quotes = [
            "Не трать время на то, кем должен быть хороший человек. Будь им. — Марк Аврелий",
            "Помни, что ты смертен. — Memento Mori",
            "Самое дорогое, что у нас есть — это время.",
            "День, который ты прожил сегодня, больше никогда не вернется.",
            "Сделай это сегодня, завтра может не наступить.",
            "Мы не имеем права потреблять счастье, не производя его.",
            "Действие — основной ключ к успеху."
        ];

        function setRandomQuote() {
            const index = Math.floor(Math.random() * quotes.length);
            document.getElementById('quote-display').innerText = quotes[index];
        }

        // --- Настройки ---
        function toggleSettings() {
            const panel = document.getElementById('settings-panel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        function saveSettings() {
            localStorage.setItem('birthDate', document.getElementById('birth-date').value);
            localStorage.setItem('targetName', document.getElementById('target-name').value);
            localStorage.setItem('targetStart', document.getElementById('target-start').value);
            localStorage.setItem('targetEnd', document.getElementById('target-end').value);
            toggleSettings();
            updateProgress();
        }

        function loadSettings() {
            document.getElementById('birth-date').value = localStorage.getItem('birthDate') || '';
            document.getElementById('target-name').value = localStorage.getItem('targetName') || '';
            document.getElementById('target-start').value = localStorage.getItem('targetStart') || '';
            document.getElementById('target-end').value = localStorage.getItem('targetEnd') || '';
        }

        // --- Обновление шкал ---
        function updateBar(id, percent, textOverride = null) {
            if (percent < 0) percent = 0;
            if (percent > 100) percent = 100;
            
            const percentStr = percent.toFixed(1) + '%';
            document.getElementById(id + '-bar').style.width = percentStr;
            document.getElementById(id + '-val').innerText = textOverride || percentStr;
        }

        function updateProgress() {
            const now = new Date();

            // 1. День
            const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            updateBar('day', ((now - startOfDay) / (24 * 60 * 60 * 1000)) * 100);

            // 2. До выходных (Считаем Пн 00:00 - Пт 18:00 рабочей зоной)
            const dayOfWeek = now.getDay(); // 0-Вс, 1-Пн... 6-Сб
            
            if (dayOfWeek === 0 || dayOfWeek === 6) {
                // Выходной
                updateBar('week', 100, "Отдыхай!");
            } else {
                // Рабочие дни (Пн-Пт)
                // Считаем прогресс от Пн 00:00 до Пт 17:00
                // Определяем текущий понедельник
                const currentMonday = new Date(now);
                const dayDiff = (dayOfWeek + 6) % 7; // Делаем Пн=0, Вт=1 ...
                currentMonday.setDate(now.getDate() - dayDiff);
                currentMonday.setHours(0,0,0,0);

                const fridayEvening = new Date(currentMonday);
                fridayEvening.setDate(currentMonday.getDate() + 4);
                fridayEvening.setHours(17,0,0,0); // Конец работы в 17:00 пятницы

                const totalWorkWeek = fridayEvening - currentMonday;
                const elapsedWork = now - currentMonday;
                
                updateBar('week', (elapsedWork / totalWorkWeek) * 100);
            }


            // 3. Месяц
            const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
            const startOfNextMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
            updateBar('month', ((now - startOfMonth) / (startOfNextMonth - startOfMonth)) * 100);

            // 4. Год
            const startOfYear = new Date(now.getFullYear(), 0, 1);
            const startOfNextYear = new Date(now.getFullYear() + 1, 0, 1);
            updateBar('year', ((now - startOfYear) / (startOfNextYear - startOfYear)) * 100);

            // 5. Жизнь
            const birthStr = localStorage.getItem('birthDate');
            if (birthStr) {
                document.getElementById('life-card').classList.remove('hidden');
                const birthDate = new Date(birthStr);
                const lifeExpectancy = new Date(birthDate.getFullYear() + 80, birthDate.getMonth(), birthDate.getDate());
                updateBar('life', ((now - birthDate) / (lifeExpectancy - birthDate)) * 100);
            } else {
                document.getElementById('life-card').classList.add('hidden');
            }

            // 6. Своя цель
            const tStart = localStorage.getItem('targetStart');
            const tEnd = localStorage.getItem('targetEnd');
            if (tStart && tEnd) {
                document.getElementById('custom-card').classList.remove('hidden');
                const tName = localStorage.getItem('targetName');
                if(tName) document.getElementById('custom-title').innerText = tName;
                
                const sDate = new Date(tStart);
                const eDate = new Date(tEnd);
                updateBar('custom', ((now - sDate) / (eDate - sDate)) * 100);
            } else {
                document.getElementById('custom-card').classList.add('hidden');
            }
        }

        // Старт
        setRandomQuote();
        loadSettings();
        updateProgress();
        setInterval(updateProgress, 1000);

    </script>
</body>
</html>
